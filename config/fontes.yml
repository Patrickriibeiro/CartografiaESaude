# Fontes externas do projeto. URLs ficam aqui, não no código (trilha §6):
# o portal já mudou de endereço uma vez (opendatasus → dadosabertos).
# Todo arquivo baixado destas URLs é registrado em dados/MANIFESTO.md.

sivep:
  conjunto: https://dadosabertos.saude.gov.br/dataset/srag-2019-a-2026
  dicionario:
    url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/dicionario-de-dados-2019-a-2025.pdf
    destino: dados/externos/dicionario-srag-2019-a-2025.pdf
    versao: "documento datado de 25/05/2023; publicado em 29/01/2026"
    descricao: Dicionário de dados SIVEP-Gripe, SRAG hospitalizado, 2019 a 2025

  # Bancos anuais em PARQUET (D-03). O nome do arquivo carrega a data da versão
  # publicada: trocar de versão = editar a linha do ano aqui. O arquivo antigo e
  # sua linha no manifesto continuam existindo; o pipeline lê só o que está aqui.
  # 2022-2024: bancos "congelados", republicados pelo Ministério em 23/03/2026.
  # 2025: banco vivo, atualizado semanalmente. A versão abaixo é o snapshot do
  # projeto (D-07: data de corte = versão vigente no primeiro download).
  bancos:
    - ano: 2022
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2022/INFLUD22-23-03-2026.parquet
      versao: "23-03-2026"
    - ano: 2023
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2023/INFLUD23-23-03-2026.parquet
      versao: "23-03-2026"
    - ano: 2024
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2024/INFLUD24-23-03-2026.parquet
      versao: "23-03-2026"
    - ano: 2025
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2025/INFLUD25-14-09-2026.parquet
      versao: "14-09-2026"

  # Versões ANTERIORES dos bancos (CS-048): o banco do ano mais recente é republicado toda
  # semana, e fichas são acrescentadas, encerradas e reclassificadas depois do fim do ano.
  # Estas versões não entram na análise; servem só para medir quanto os números mudam.
  # O portal lista só a versão atual; estas foram achadas em 2026-09-26 testando o
  # endereço de cada data (o S3 recusa listagem). Uma por mês para 2025; para 2024, a
  # única versão anterior encontrada.
  versoes_anteriores:
    - ano: 2025
      versao: "09-03-2026"
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2025/INFLUD25-09-03-2026.parquet
    - ano: 2025
      versao: "04-05-2026"
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2025/INFLUD25-04-05-2026.parquet
    - ano: 2025
      versao: "01-06-2026"
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2025/INFLUD25-01-06-2026.parquet
    - ano: 2025
      versao: "06-07-2026"
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2025/INFLUD25-06-07-2026.parquet
    - ano: 2025
      versao: "03-08-2026"
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2025/INFLUD25-03-08-2026.parquet
    - ano: 2025
      versao: "24-08-2026"
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2025/INFLUD25-24-08-2026.parquet
    - ano: 2024
      versao: "26-06-2025"
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/SRAG/2024/INFLUD24-26-06-2025.parquet

ibge:
  # População residente por município (API SIDRA). Resposta JSON guardada como
  # veio, registrada no manifesto; o parse é feito localmente.
  populacao:
    - ano: 2022
      tabela: 4714
      descricao: "Censo 2022, população residente (data de referência 01/08/2022)"
      url: https://apisidra.ibge.gov.br/values/t/4714/n6/in%20n3%2033/v/93/p/2022
      destino: dados/externos/sidra_4714_censo_2022_rj.json
      data_referencia: "2022-08-01"
    - ano: 2024
      tabela: 6579
      descricao: "Estimativa da população residente, 1º de julho de 2024"
      url: https://apisidra.ibge.gov.br/values/t/6579/n6/in%20n3%2033/v/9324/p/2024
      destino: dados/externos/sidra_6579_estimativa_2024_rj.json
      data_referencia: "2024-07-01"
    - ano: 2025
      tabela: 6579
      descricao: "Estimativa da população residente, 1º de julho de 2025"
      url: https://apisidra.ibge.gov.br/values/t/6579/n6/in%20n3%2033/v/9324/p/2025
      destino: dados/externos/sidra_6579_estimativa_2025_rj.json
      data_referencia: "2025-07-01"
    # Estimativa pré-Censo, usada só para medir a descontinuidade (ADR-0003).
    - ano: 2021
      tabela: 6579
      descricao: "Estimativa da população residente, 1º de julho de 2021 (pré-Censo; só diagnóstico)"
      url: https://apisidra.ibge.gov.br/values/t/6579/n6/in%20n3%2033/v/9324/p/2021
      destino: dados/externos/sidra_6579_estimativa_2021_rj.json
      data_referencia: "2021-07-01"

  # Censo 2022 por grupo de idade (SIDRA 9514), só para a padronização por idade
  # (CS-033, OE9): sexo Total, forma de declaração Total, 21 grupos quinquenais +
  # "Menos de 1 ano" + Total. É a única estrutura etária municipal que o IBGE tem;
  # os outros anos usam a proporção de 2022 aplicada à população do ano.
  populacao_idade:
    ano: 2022
    tabela: 9514
    descricao: "Censo 2022, população residente por grupo de idade (data de referência 01/08/2022)"
    url: https://apisidra.ibge.gov.br/values/t/9514/n6/in%20n3%2033/v/93/p/2022/c2/6794/c286/113635/c287/100362,93070,6557,93084,93085,93086,93087,93088,93089,93090,93091,93092,93093,93094,93095,93096,93097,93098,49108,49109,60040,60041,6653
    destino: dados/externos/sidra_9514_censo_2022_idade_rj.json
    data_referencia: "2022-08-01"

  # Malha municipal oficial do IBGE, resolução completa (ADR-0006: não a
  # simplificada do geobr, que perde 8 pares de vizinhos no RJ).
  malha_municipal:
    url: https://geoftp.ibge.gov.br/organizacao_do_territorio/malhas_territoriais/malhas_municipais/municipio_2022/UFs/RJ/RJ_Municipios_2022.zip
    destino: dados/externos/RJ_Municipios_2022.zip
    camada: RJ_Municipios_2022.shp
    versao: "Malha Municipal 2022 (IBGE), publicada em 28/03/2023"
    descricao: Malha municipal do RJ, IBGE 2022, SIRGAS 2000, resolução completa

# Regiões de saúde (CS-030). Só a tabela município -> região é usada; a geometria
# regional sai de dissolver a malha do IBGE acima (ADR-0006). O arquivo cobre o
# Brasil inteiro (21 MB), por isso fica em dados/brutos, fora do git.
# A composição do RJ é a mesma nas edições 2013, 2023, 2024 e 2025 do geobr.
regioes_saude:
  url: https://github.com/ipea/geobr_prep_data/releases/download/v2.0.0/healthregions_2025_simplified.parquet
  destino: dados/brutos/geobr_healthregions_2025_simplified.parquet
  versao: "geobr_prep_data v2.0.0, regiões de saúde 2025"
  descricao: Regiões de saúde do Brasil (Ministério da Saúde, via geobr/IPEA), tabela município -> região

# Início da campanha nacional de vacinação contra influenza (regiões Sudeste, Sul,
# Nordeste e Centro-Oeste), marcado nos gráficos da série semanal (CS-032).
# Datas conferidas em 2026-09-25 nas páginas abaixo. Em 2025 o RJ antecipou a
# campanha estadual para o fim de março; o gráfico marca a data nacional.
campanhas_influenza:
  - ano: 2022
    inicio: "2022-04-04"
    fonte: https://www.gov.br/saude/pt-br/assuntos/noticias/2022/abril/ministerio-da-saude-da-inicio-a-campanha-de-vacinacao-contra-a-influenza-e-sarampo-nesta-segunda-04
  - ano: 2023
    inicio: "2023-04-10"
    fonte: https://bvsms.saude.gov.br/25a-campanha-nacional-de-vacinacao-contra-a-influenza-sera-realizada-no-periodo-de-10-4-a-31-5-2023/
  - ano: 2024
    inicio: "2024-03-25"
    fonte: https://www.gov.br/saude/pt-br/assuntos/noticias/2024/marco/campanha-de-vacinacao-contra-a-gripe-comeca-oficialmente-nesta-segunda-feira-25
  - ano: 2025
    inicio: "2025-04-07"
    fonte: https://prefeitura.rio/saude/campanha-de-vacinacao-contra-gripe-comeca-na-cidade-do-rio/

# Leitos SUS por estabelecimento (CNES), conjunto "Hospitais e Leitos" do Portal de
# Dados Abertos do SUS (CS-034). Um arquivo por ano, uma linha por estabelecimento e
# competência mensal (COMP = AAAAMM); usa-se julho, como a população (ADR-0003).
# Os arquivos mudam de formato entre anos: codificação, separador, nomes de coluna e,
# em 2025, zip com a coluna CO_IBGE. Declarados aqui, não adivinhados.
leitos_cnes:
  conjunto: https://dadosabertos.saude.gov.br/dataset/hospitais-e-leitos
  competencia_mes: "07"
  arquivos:
    - ano: 2022
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/Leitos_SUS/Leitos_2022.csv
      destino: dados/brutos/Leitos_2022.csv
      codificacao: UTF-8
      separador: ","
    - ano: 2023
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/Leitos_SUS/Leitos_2023.csv
      destino: dados/brutos/Leitos_2023.csv
      codificacao: latin1
      separador: ","
    - ano: 2024
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/Leitos_SUS/Leitos_2024.csv
      destino: dados/brutos/Leitos_2024.csv
      codificacao: latin1
      separador: ","
    - ano: 2025
      url: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/Leitos_SUS/Leitos_csv_2025.zip
      destino: dados/brutos/Leitos_csv_2025.zip
      arquivo_no_zip: Leitos_2025.csv
      codificacao: latin1
      separador: ";"
